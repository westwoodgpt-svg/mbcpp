document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

*/\n  --brown-700: #446da3;\n  --brown-600: #6486b3;\n  --brown-500: #88a2c5;\n\n  --tan-700: #a17825;\n  --tan-600: #b98a2a;\n  --tan-500: #c9962e;     /* Kaliningrad amber/янтарь — secondary, marks */\n  --tan-400: #d3a954;\n  --tan-300: #dbba75;\n  --tan-200: #e5cd9b;\n  --tan-100: #f0e2c4;     /* warm amber-tinted cream surface */\n\n  --coral-700: #a81f31;\n  --coral-600: #c8253a;   /* Kaliningrad shield/flag red — accent, CTAs */\n  --coral-500: #d04456;\n  --coral-400: #d96675;\n\n  /* ---- Documented secondary colors (national guide p.18) ---- */\n  --blue-doc: #002f87;    /* тёмно-синий — for business documentation */\n  --green-web: #00be37;   /* зелёный — for interactive elements in web */\n\n  /* ---- Neutrals (warm-tinted greys, based on official чёрный #2C2A29) ---- */\n  --ink-900: #312d2b;\n  --ink-700: #797673;\n  --ink-500: #a7a5a2;\n  --ink-300: #d0ccca;\n  --ink-200: #e2dedc;\n  --ink-100: #eeebe9;\n  --paper: #ffffff;       /* official белый */\n  --bg: #faf6f1;          /* page background, faint warm */\n\n  /* ---- Semantic ---- */\n  --success: var(--green-web);\n  --warning: #e0992f;\n  --danger: var(--coral-600);\n  --info: var(--blue-doc);\n\n  /* ---- Aliases ---- */\n  --color-primary: var(--brown-800);\n  --color-primary-hover: var(--brown-900);\n  --color-accent: var(--coral-600);\n  --color-accent-hover: var(--coral-700);\n  --color-secondary: var(--tan-500);\n\n  --text-strong: var(--ink-900);\n  --text-body: var(--ink-700);\n  --text-muted: var(--ink-500);\n  --text-on-dark: #fbf6f0;\n  --text-on-accent: #ffffff;\n\n  --surface-page: var(--bg);\n  --surface-card: var(--paper);\n  --surface-warm: var(--tan-100);\n  --surface-brand: var(--brown-800);\n\n  --border-subtle: var(--ink-200);\n  --border-strong: var(--ink-300);\n  --focus-ring: var(--coral-500);\n}\n</style>\n<style>/* Мой бизнес — Typography tokens\n   Per the official guide: Circe for display/headings (substituted with\n   Manrope — closest free geometric sans, no official files available),\n   PT Sans for body text (the ACTUAL specified brand font, loaded for real). */\n:root {\n  --font-sans: \"PT Sans\", \"Segoe UI\", \"Helvetica Neue\", Arial, sans-serif;\n  --font-display: \"Manrope\", \"Segoe UI\", Arial, sans-serif;\n\n  /* Weights */\n  --fw-regular: 400;   /* @kind font */\n  --fw-medium: 500;    /* @kind font */\n  --fw-semibold: 600;  /* @kind font */\n  --fw-bold: 700;      /* @kind font */\n  --fw-extrabold: 800; /* @kind font */\n\n  /* Type scale (1.25 major-third-ish, tuned) */\n  --fs-display: 56px;\n  --fs-h1: 40px;\n  --fs-h2: 30px;\n  --fs-h3: 23px;\n  --fs-h4: 19px;\n  --fs-body-lg: 18px;\n  --fs-body: 16px;\n  --fs-sm: 14px;\n  --fs-xs: 12px;\n\n  /* Line heights */\n  --lh-tight: 1.1;     /* @kind font */\n  --lh-heading: 1.2;   /* @kind font */\n  --lh-body: 1.55;     /* @kind font */\n\n  /* Letter spacing */\n  --ls-display: -0.02em; /* @kind font */\n  --ls-heading: -0.01em; /* @kind font */\n  --ls-label: 0.04em;    /* @kind font */\n}\n</style>\n<style>/* Мой бизнес — Spacing, radius, shadow, layout tokens */\n:root {\n  /* Spacing scale (4px base) */\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 24px;\n  --space-6: 32px;\n  --space-7: 48px;\n  --space-8: 64px;\n  --space-9: 96px;\n\n  /* Radius — brand leans friendly/rounded */\n  --radius-sm: 8px;\n  --radius-md: 14px;\n  --radius-lg: 20px;\n  --radius-xl: 28px;\n  --radius-pill: 999px;\n\n  /* Shadows — soft warm-tinted */\n  --shadow-sm: 0 1px 2px rgba(58, 34, 29, 0.06), 0 1px 3px rgba(58, 34, 29, 0.08);\n  --shadow-md: 0 4px 12px rgba(58, 34, 29, 0.08), 0 2px 4px rgba(58, 34, 29, 0.06);\n  --shadow-lg: 0 12px 32px rgba(58, 34, 29, 0.12), 0 4px 8px rgba(58, 34, 29, 0.06);\n  --shadow-accent: 0 8px 20px rgba(200, 37, 58, 0.28);\n\n  /* Layout */\n  --container: 1200px;        /* @kind spacing */\n  --container-narrow: 800px;  /* @kind spacing */\n\n  /* Motion */\n  --ease-standard: cubic-bezier(0.22, 0.61, 0.36, 1); /* @kind other */\n  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */\n  --dur-fast: 140ms;  /* @kind other */\n  --dur-base: 220ms;  /* @kind other */\n  --dur-slow: 360ms;  /* @kind other */\n}\n</style>\n<style>/* Мой бизнес — Base element styles & helpers (optional reset layer). */\n* { box-sizing: border-box; }\n\nbody {\n  margin: 0;\n  font-family: var(--font-sans);\n  font-size: var(--fs-body);\n  line-height: var(--lh-body);\n  color: var(--text-body);\n  background: var(--surface-page);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\nh1, h2, h3, h4 {\n  font-family: var(--font-display);\n  color: var(--text-strong);\n  line-height: var(--lh-heading);\n  margin: 0 0 var(--space-4);\n}\nh1 { font-size: var(--fs-h1); font-weight: var(--fw-extrabold); letter-spacing: var(--ls-heading); }\nh2 { font-size: var(--fs-h2); font-weight: var(--fw-bold); letter-spacing: var(--ls-heading); }\nh3 { font-size: var(--fs-h3); font-weight: var(--fw-bold); }\nh4 { font-size: var(--fs-h4); font-weight: var(--fw-semibold); }\n\np { margin: 0 0 var(--space-4); text-wrap: pretty; }\n\na { color: var(--color-accent); text-decoration: none; }\na:hover { color: var(--color-accent-hover); }\n\n.mb-eyebrow {\n  font-size: var(--fs-xs);\n  font-weight: var(--fw-bold);\n  letter-spacing: var(--ls-label);\n  text-transform: uppercase;\n  color: var(--color-accent);\n}\n\n.mb-container { max-width: var(--container); margin-inline: auto; padding-inline: var(--space-5); }\n</style>\n<style>/* Мой бизнес — Design System entry point.\n   Consumers link this single file. It only @imports token + font sources. */\n/* Мой бизнес — Webfonts\n   Per the official brand guideline (p.20): display font is Circe (headings,\n   accidental type, signage); body font is PT Sans (main text-setting).\n   SUBSTITUTION: Circe is a paid font with no free distribution — Manrope\n   (Google Fonts) stands in for it as the closest free geometric-sans ma mal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"c6382adf-499d-4358-8869-1acd7fc2ea78\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* Мой бизнес — Color tokens · KALININGRAD REGIONAL EDITION\n   Base \"Мой бизнес\" palette adapted per the official guideline's regional\n   co-branding rule (p.43): \"фирменный блок проекта «Мой бизнес» может быть\n   выполнен в фирменных цветах региона... в качестве основного используется\n   тёмный цвет [региона], в качестве дополнительного – один из цветов\n   геральдической зоны.\"\n   Kaliningrad Oblast heraldry: shield/flag red (top), amber/gold (the amber\n   circles on the shield — the region's signature symbol), azure/blue (the\n   shield's wavy base, the region's dark/primary tone), silver/white.\n   Mapping: --brown-* (primary/dark) → Kaliningrad azure blue.\n            --tan-*   (secondary)    → Kaliningrad amber/gold (янтарь).\n            --coral-* (accent)       → Kaliningrad heraldic red.\n   Same token names/roles as the national system, region-adapted values. */\n:root {\n  /* ---- Brand core (regional) ---- */\n  --brown-900: #123461;  /* Kaliningrad azure, darkest — footer/dark surfaces */\n  --brown-800: #1b4d8f;  /* Kaliningrad azure — primary, headers, CTAs */\n  --brown-700: #446da3;\n  --brown-600: #6486b3;\n  --brown-500: #88a2c5;\n\n  --tan-700: #a17825;\n  --tan-600: #b98a2a;\n  --tan-500: #c9962e;     /* Kaliningrad amber/янтарь — secondary, marks */\n  --tan-400: #d3a954;\n  --tan-300: #dbba75;\n  --tan-200: #e5cd9b;\n  --tan-100: #f0e2c4;     /* warm amber-tinted cream surface */\n\n  --coral-700: #a81f31;\n  --coral-600: #c8253a;   /* Kaliningrad shield/flag red — accent, CTAs */\n  --coral-500: #d04456;\n  --coral-400: #d96675;\n\n  /* ---- Documented secondary colors (national guide p.18) ---- */\n  --blue-doc: #002f87;    /* тёмно-синий — for business documentation */\n  --green-web: #00be37;   /* зелёный — for interactive elements in web */\n\n  /* ---- Neutrals (warm-tinted greys, based on official чёрный #2C2A29) ---- */\n  --ink-900: #312d2b;\n  --ink-700: #797673;\n  --ink-500: #a7a5a2;\n  --ink-300: #d0ccca;\n  --ink-200: #e2dedc;\n  --ink-100: #eeebe9;\n  --paper: #ffffff;       /* official белый */\n  --bg: #faf6f1;          /* page background, faint warm */\n\n  /* ---- Semantic ---- */\n  --success: var(--green-web);\n  --warning: #e0992f;\n  --danger: var(--coral-600);\n  --info: var(--blue-doc);\n\n  /* ---- Aliases ---- */\n  --color-primary: var(--brown-800);\n  --color-primary-hover: var(--brown-900);\n  --color-accent: var(--coral-600);\n  --color-accent-hover: var(--coral-700);\n  --color-secondary: var(--tan-500);\n\n  --text-strong: var(--ink-900);\n  --text-body: var(--ink-700);\n  --text-muted: var(--ink-500);\n  --text-on-dark: #fbf6f0;\n  --text-on-accent: #ffffff;\n\n  --surface-page: var(--bg);\n  --surface-card: var(--paper);\n  --surface-warm: var(--tan-100);\n  --surface-brand: var(--brown-800);\n\n  --border-subtle: var(--ink-200);\n  --border-strong: var(--ink-300);\n  --focus-ring: var(--coral-500);\n}\n\n/* Мой бизнес — Typography tokens\n   Per the official guide: Circe for display/headings (substituted with\n   Manrope — closest free geometric sans, no official files available),\n   PT Sans for body text (the ACTUAL specified brand font, loaded for real). */\n:root {\n  --font-sans: \"PT Sans\", \"Segoe UI\", \"Helvetica Neue\", Arial, sans-serif;\n  --font-display: \"Manrope\", \"Segoe UI\", Arial, sans-serif;\n\n  /* Weights */\n  --fw-regular: 400;   /* @kind font */\n  --fw-medium: 500;    /* @kind font */\n  --fw-semibold: 600;  /* @kind font */\n  --fw-bold: 700;      /* @kind font */\n  --fw-extrabold: 800; /* @kind font */\n\n  /* Type scale (1.25 major-third-ish, tuned) */\n  --fs-display: 56px;\n  --fs-h1: 40px;\n  --fs-h2: 30px;\n  --fs-h3: 23px;\n  --fs-h4: 19px;\n  --fs-body-lg: 18px;\n  --fs-body: 16px;\n  --fs-sm: 14px;\n  --fs-xs: 12px;\n\n  /* Line heights */\n  --lh-tight: 1.1;     /* @kind font */\n  --lh-heading: 1.2;   /* @kind font */\n  --lh-body: 1.55;     /* @kind font */\n\n  /* Letter spacing */\n  --ls-display: -0.02em; /* @kind font */\n  --ls-heading: -0.01em; /* @kind font */\n  --ls-label: 0.04em;    /* @kind font */\n}\n\n/* Мой бизнес — Spacing, radius, shadow, layout tokens */\n:root {\n  /* Spacing scale (4px base) */\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 24px;\n  --space-6: 32px;\n  --space-7: 48px;\n  --space-8: 64px;\n  --space-9: 96px;\n\n  /* Radius — brand leans friendly/rounded */\n  --radius-sm: 8px;\n  --radius-md: 14px;\n  --radius-lg: 20px;\n  --radius-xl: 28px;\n  --radius-pill: 999px;\n\n  /* Shadows — soft warm-tinted */\n  --shadow-sm: 0 1px 2px rgba(58, 34, 29, 0.06), 0 1px 3px rgba(58, 34, 29, 0.08);\n  --shadow-md: 0 4px 12px rgba(58, 34, 29, 0.08), 0 2px 4px rgba(58, 34, 29, 0.06);\n  --shadow-lg: 0 12px 32px rgba(58, 34, 29, 0.12), 0 4px 8px rgba(58, 34, 29, 0.06);\n  --shadow-accent: 0 8px 20px rgba(200, 37, 58, 0.28);\n\n  /* Layout */\n  --container: 1200px;        /* @kind spacing */\n  --container-narrow: 800px;  /* @kind spacing */\n\n  /* Motion */\n  --ease-standard: cubic-bezier(0.22, 0.61, 0.36, 1); /* @kind other */\n  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */\n  --dur-fast: 140ms;  /* @kind other */\n  --dur-base: 220ms;  /* @kind other */\n  --dur-slow: 360ms;  /* @kind other */\n}\n\n/* Мой бизнес — Base element styles & helpers (optional reset layer). */\n* { box-sizing: border-box; }\n\nbody {\n  margin: 0;\n  font-family: var(--font-sans);\n  font-size: var(--fs-body);\n  line-height: var(--lh-body);\n  color: var(--text-body);\n  background: var(--surface-page);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\nh1, h2, h3, h4 {\n  font-family: var(--font-display);\n  color: var(--text-strong);\n  line-height: var(--lh-heading);\n  margin: 0 0 var(--space-4);\n}\nh1 { font-size: var(--fs-h1); font-weight: var(--fw-extrabold); letter-spacing: var(--ls-heading); }\nh2 { font-size: var(--fs-h2); font-weight: var(--fw-bold); letter-spacing: var(--ls-heading); }\nh3 { font-size: var(--fs-h3); font-weight: var(--fw-bold); }\nh4 { font-size: var(--fs-h4); font-weight: var(--fw-semibold); }\n\np { margin: 0 0 var(--space-4); text-wrap: pretty; }\n\na { color: var(--color-accent); text-decoration: none; }\na:hover { color: var(--color-accent-hover); }\n\n.mb-eyebrow {\n  font-size: var(--fs-xs);\n  font-weight: var(--fw-bold);\n  letter-spacing: var(--ls-label);\n  text-transform: uppercase;\n  color: var(--color-accent);\n}\n\n.mb-container { max-width: var(--container); margin-inline: auto; padding-inline: var(--space-5); }\n\n</style>\n<script src=\"3dd5db82-ea62-40c3-b302-a7dc65163235\"><\u002Fscript>\n<script src=\"59d596df-8a9a-4f9f-8236-1ac03700a1b3\"><\u002Fscript>\n<script src=\"acdf98a5-a3ff-4845-874a-e6543f41af7f\"><\u002Fscript>\n<style>\n  html,body{margin:0;background:var(--bg);color:var(--text-body);font-family:var(--font-sans,'Manrope',sans-serif)}\n  *{box-sizing:border-box}\n  a{color:inherit;text-decoration:none}\n  .mb-link{transition:color .15s}\n  .mb-link:hover{color:var(--coral-600)}\n  .mb-card{transition:transform .2s ease,box-shadow .2s ease}\n  .mb-card:hover{transform:translateY(-4px);box-shadow:0 16px 40px -18px rgba(58,34,29,.35)}\n  .mb-btn{transition:background .15s,transform .1s,box-shadow .15s}\n  .mb-btn:active{transform:scale(.98)}\n  @keyframes mbrise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}\n  @keyframes mbfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}\n  @keyframes mbpulse{0%,100%{box-shadow:0 12px 30px -10px rgba(200,37,58,.7)}50%{box-shadow:0 12px 40px -6px rgba(200,37,58,.95)}}\n  .mb-menu-btn{display:none}\n  /* ===== Responsive ===== */\n  @media (max-width:760px){\n    [style*=\"max-width: 1240px\"]{padding-left:18px!important;padding-right:18px!important}\n    [style*=\"grid-template-columns: 300px 1fr\"]{grid-template-columns:1fr!important;gap:24px!important}\n    [style*=\"grid-template-columns: repeat(2, 1fr)\"]{grid-template-columns:1fr!important}\n    [style*=\"grid-template-columns: 1.5fr 1fr 1.2fr\"]{grid-template-columns:1fr!important}\n    [style*=\"position: sticky; top: 96px\"]{position:static!important;top:auto!important}\n    .mb-card-actions{flex-direction:column!important}\n    [style*=\"font-size: 52px\"]{font-size:32px!important}\n    [style*=\"font-size: 30px\"]{font-size:24px!important}\n    [style*=\"padding: 48px;\"]{padding:28px!important}\n    .mb-nav{display:none!important}\n    .mb-header-cta{display:none!important}\n    .mb-menu-btn{display:inline-flex!important}\n    .mb-topbar-collapse{display:none!important}\n  }\n</style>\n\n</helmet>\n\n<div style=\"min-height:100vh;overflow-x:hidden\">\n\n  <!-- Top bar -->\n  <div style=\"background:var(--brown-900);color:rgba(251,246,240,.82);font-size:13px\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:9px 32px;display:flex;align-items:center;gap:20px;flex-wrap:wrap\">\n      <span style=\"color:var(--tan-400)\">Центр поддержки предпринимательства Калининградской области</span>\n      <div style=\"margin-left:auto;display:flex;align-items:center;gap:18px\" class=\"mb-topbar-collapse\">\n        <a class=\"mb-link\" href=\"tel:+74012994588\" style=\"display:flex;align-items:center;gap:6px\"><i data-lucide=\"phone\" style=\"width:14px;height:14px\"></i>+7 (4012) 994&nbsp;588</a>\n        <a class=\"mb-link\" href=\"mailto:info@mbkaliningrad.ru\" style=\"display:flex;align-items:center;gap:6px\"><i data-lucide=\"mail\" style=\"width:14px;height:14px\"></i>info@mbkaliningrad.ru</a>\n        <a class=\"mb-link\" href=\"#\" style=\"display:flex;align-items:center;gap:6px;color:var(--tan-400)\"><i data-lucide=\"eye\" style=\"width:14px;height:14px\"></i>Версия для слабовидящих</a>\n      </div>\n    </div>\n  </div>\n\n  <!-- Header -->\n  <header style=\"position:sticky;top:0;z-index:40;background:rgba(250,246,241,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border-subtle)\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:0 32px;display:flex;align-items:center;gap:28px;height:78px\">\n      <a href=\"index.html\" style=\"display:flex;align-items:center;gap:10px\" aria-label=\"Мой бизнес — Калининградская область\">\n        <img src=\"d9ab5f93-2701-4204-9fc9-cd2c4ddf182e\" width=\"34\" height=\"41\" alt=\"\" style=\"display:block;flex:none\">\n        <span style=\"display:flex;flex-direction:column;line-height:.95;font-family:var(--font-display)\"><span style=\"font-weight:800;font-size:15px;letter-spacing:-.01em;color:var(--brown-800)\">мой</span><span style=\"font-weight:800;font-size:15px;letter-spacing:-.01em;color:var(--brown-800)\">бизнес</span></span>\n        <span style=\"display:flex;align-items:center;gap:7px;padding-left:10px;margin-left:2px;border-left:1px solid var(--border-subtle)\">\n          <span style=\"display:flex;flex-direction:column;width:13px;height:17px;border-radius:2px;overflow:hidden;flex:none\"><span style=\"flex:1;background:var(--coral-600)\"></span><span style=\"flex:.34;background:var(--tan-500)\"></span><span style=\"flex:1;background:var(--brown-800)\"></span></span>\n          <span style=\"font-size:11px;font-weight:700;color:var(--text-muted);line-height:1.15;max-width:88px\">Калининградская область</span>\n        </span>\n      </a>\n      <nav class=\"mb-nav\" style=\"display:flex;gap:24px;margin-left:auto\">\n        <a class=\"mb-link\" href=\"o-centre.html\" style=\"font-weight:600;font-size:15px\">О Центре</a>\n        <a class=\"mb-link\" href=\"uslugi.html\" style=\"font-weight:700;font-size:15px;color:var(--coral-600)\">Услуги</a>\n        <a class=\"mb-link\" href=\"meropriyatiya.html\" style=\"font-weight:600;font-size:15px\">Мероприятия</a>\n        <a class=\"mb-link\" href=\"novosti.html\" style=\"font-weight:600;font-size:15px\">Новости</a>\n        <a class=\"mb-link\" href=\"index.html#stories\" style=\"font-weight:600;font-size:15px\">Истории успеха</a>\n        <a class=\"mb-link\" href=\"index.html#contacts\" style=\"font-weight:600;font-size:15px\">Контакты</a>\n      </nav>\n      <button class=\"mb-btn mb-header-cta\" sc-camel-on-click=\"{{ openModal }}\" style=\"border:none;cursor:pointer;background:var(--coral-600);color:#fff;font-weight:700;font-size:15px;padding:11px 22px;border-radius:13px;box-shadow:0 8px 20px -8px rgba(221,75,51,.6)\" style-hover=\"background:var(--coral-700)\">Получить поддержку</button>\n      <button class=\"mb-btn mb-menu-btn\" sc-camel-on-click=\"{{ toggleMenu }}\" aria-label=\"Меню\" style=\"margin-left:auto;border:none;cursor:pointer;background:transparent;color:var(--brown-900);padding:6px;align-items:center\"><i data-lucide=\"menu\" style=\"width:28px;height:28px\"></i></button>\n    </div>\n    <sc-if value=\"{{ menuOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"border-top:1px solid var(--border-subtle);background:var(--bg);padding:10px 18px 18px;display:flex;flex-direction:column;gap:2px\">\n        <sc-for list=\"{{ navLinks }}\" as=\"n\" hint-placeholder-count=\"6\">\n          <a class=\"mb-link\" href=\"{{ n.href }}\" sc-camel-on-click=\"{{ closeMenu }}\" style=\"font-weight:600;font-size:17px;padding:12px 6px;border-bottom:1px solid var(--border-subtle)\">{{ n.label }}</a>\n        </sc-for>\n        <button class=\"mb-btn\" sc-camel-on-click=\"{{ openModalFromMenu }}\" style=\"margin-top:12px;border:none;cursor:pointer;background:var(--coral-600);color:#fff;font-weight:700;font-size:16px;padding:14px 22px;border-radius:13px\">Получить поддержку</button>\n      </div>\n    </sc-if>\n  </header>\n\n  <!-- HEADING -->\n  <section style=\"background:var(--brown-800);color:#fff;position:relative;overflow:hidden\">\n    <svg width=\"260\" height=\"190\" sc-camel-view-box=\"0 0 320 234\" style=\"position:absolute;right:10px;top:10px;color:var(--tan-400);opacity:.16;pointer-events:none\" aria-hidden=\"true\">\n      <circle cx=\"40\" cy=\"40\" r=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"></circle>\n      <polyline points=\"120,30 132,10 144,30 156,10 168,30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></polyline>\n      <rect x=\"230\" y=\"18\" width=\"26\" height=\"26\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"></rect>\n      <g fill=\"currentColor\"><circle cx=\"60\" cy=\"110\" r=\"3\"></circle><circle cx=\"72\" cy=\"110\" r=\"3\"></circle><circle cx=\"84\" cy=\"110\" r=\"3\"></circle></g>\n      <line x1=\"170\" y1=\"130\" x2=\"192\" y2=\"100\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linecap=\"round\"></line>\n      <path d=\"M 240 130 a 18 18 0 0 1 36 0 Z\" fill=\"currentColor\"></path>\n    </svg>\n    <div style=\"position:absolute;right:9%;top:54%;transform:translateY(-50%);font-size:200px;opacity:.1;color:var(--tan-400);animation:mbfloat 6s ease-in-out infinite;pointer-events:none\"><i data-lucide=\"rocket\" style=\"width:200px;height:200px\"></i></div>\n    <div style=\"max-width:1240px;margin:0 auto;padding:30px 32px 56px;position:relative;z-index:1\">\n      <div style=\"display:flex;align-items:center;gap:8px;font-size:13px;color:rgba(251,246,240,.7);margin-bottom:26px\">\n        <a class=\"mb-link\" href=\"index.html\" style=\"color:rgba(251,246,240,.7)\">Главная</a>\n        <i data-lucide=\"chevron-right\" style=\"width:14px;height:14px\"></i>\n        <span style=\"color:var(--tan-400)\">Услуги</span>\n      </div>\n      <span style=\"display:inline-flex;align-items:center;gap:8px;background:var(--coral-600);color:#fff;font-size:13px;font-weight:700;padding:7px 15px;border-radius:999px;margin-bottom:18px;animation:mbrise .5s ease both\"><i data-lucide=\"sparkles\" style=\"width:15px;height:15px\"></i>161 167 услуг оказано предпринимателям</span>\n      <h1 style=\"margin:0;max-width:760px;font-size:52px;font-weight:800;line-height:1.06;letter-spacing:-.02em;animation:mbrise .55s ease .08s both\">Полный спектр услуг для развития вашего бизнеса</h1>\n      <p style=\"margin:18px 0 28px;max-width:600px;font-size:19px;line-height:1.55;color:rgba(251,246,240,.86);animation:mbrise .6s ease .18s both\">От оформления документов до выхода на зарубежные рынки — помогаем бизнесу на всех этапах. Все услуги центра бесплатны.</p>\n      <button class=\"mb-btn\" sc-camel-on-click=\"{{ openModal }}\" style=\"border:none;cursor:pointer;background:var(--coral-600);color:#fff;font-weight:700;font-size:17px;padding:15px 32px;border-radius:14px;box-shadow:0 12px 28px -10px rgba(221,75,51,.7);animation:mbrise .6s ease .28s both\" style-hover=\"background:var(--coral-700)\">Получить поддержку</button>\n    </div>\n  </section>\n\n  <!-- CONTENT: filter + list -->\n  <section style=\"max-width:1240px;margin:0 auto;padding:48px 32px 80px;display:grid;grid-template-columns:300px 1fr;gap:40px;align-items:start\">\n\n    <!-- Sidebar filter -->\n    <aside style=\"position:sticky;top:96px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:20px;padding:26px 24px\">\n      <h3 style=\"margin:0 0 4px;font-size:20px;font-weight:800;color:var(--text-strong)\">Найти услугу</h3>\n      <p style=\"margin:0 0 22px;font-size:13px;color:var(--text-muted)\">Отфильтруйте по аудитории и категории</p>\n\n      <div style=\"font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--coral-600);margin-bottom:12px\">Кому</div>\n      <div style=\"display:flex;flex-direction:column;margin-bottom:24px\">\n        <sc-for list=\"{{ audienceRadios }}\" as=\"a\" hint-placeholder-count=\"6\">\n          <button sc-camel-on-click=\"{{ a.onClick }}\" class=\"mb-btn\" style=\"display:flex;align-items:center;gap:11px;width:100%;text-align:left;cursor:pointer;background:transparent;border:none;padding:8px 0;font-family:inherit\">\n            <span style=\"flex:none;width:20px;height:20px;border-radius:50%;border:2px solid {{ a.ring }};display:flex;align-items:center;justify-content:center\"><span style=\"width:10px;height:10px;border-radius:50%;background:{{ a.dot }}\"></span></span>\n            <span style=\"font-size:14px;font-weight:{{ a.weight }};color:{{ a.color }};line-height:1.3\">{{ a.label }}</span>\n          </button>\n        </sc-for>\n      </div>\n\n      <div style=\"height:1px;background:var(--border-subtle);margin-bottom:20px\"></div>\n\n      <div style=\"font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--coral-600);margin-bottom:12px\">Категория</div>\n      <div style=\"display:flex;flex-direction:column;margin-bottom:24px\">\n        <sc-for list=\"{{ categoryChecks }}\" as=\"c\" hint-placeholder-count=\"6\">\n          <button sc-camel-on-click=\"{{ c.onClick }}\" class=\"mb-btn\" style=\"display:flex;align-items:center;gap:11px;width:100%;text-align:left;cursor:pointer;background:transparent;border:none;padding:8px 0;font-family:inherit\">\n            <span style=\"flex:none;width:20px;height:20px;border-radius:6px;border:2px solid {{ c.ring }};background:{{ c.fill }};display:flex;align-items:center;justify-content:center;color:#fff\"><i data-lucide=\"check\" style=\"width:13px;height:13px;opacity:{{ c.checkOpacity }}\"></i></span>\n            <span style=\"font-size:14px;font-weight:{{ c.weight }};color:{{ c.color }};line-height:1.3\">{{ c.label }}</span>\n          </button>\n        </sc-for>\n      </div>\n\n      <button sc-camel-on-click=\"{{ resetFilters }}\" class=\"mb-btn\" style=\"width:100%;cursor:pointer;border:1px solid var(--border-strong);background:transparent;color:var(--brown-800);font-weight:700;font-size:14px;padding:11px;border padding:14px 0\">\n            <div style=\"width:64px;height:64px;border-radius:50%;background:rgba(0,190,55,.15);color:var(--success);display:flex;align-items:center;justify-content:center;margin:0 auto 18px\"><i data-lucide=\"check\" style=\"width:32px;height:32px\"></i></div>\n            <h3 style=\"margin:0 0 10px;color:var(--text-strong);font-size:22px\">Спасибо за обращение</h3>\n            <p style=\"margin:0 0 22px;color:var(--text-muted);font-size:16px;line-height:1.5\">Наши специалисты свяжутся с вами в течение одного рабочего дня.</p>\n            <button class=\"mb-btn\" sc-camel-on-click=\"{{ closeModal }}\" style=\"border:none;cursor:pointer;background:var(--brown-800);color:#fff;font-weight:700;font-size:15px;padding:12px 28px;border-radius:13px\">Закрыть</button>\n          </div>\n        </sc-if>\n        <sc-if value=\"{{ modalForm }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;flex-direction:column;gap:14px\">\n            <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:12px\">\n              <div>\n                <h3 style=\"margin:0 0 4px;color:var(--text-strong);font-size:23px\">Заявка на консультацию</h3>\n                <p style=\"margin:0;color:var(--text-muted);font-size:14px\">Оставьте свой вопрос, и мы обязательно свяжемся с вами.</p>\n              </div>\n              <button sc-camel-on-click=\"{{ closeModal }}\" style=\"flex:none;cursor:pointer;border:none;background:var(--tan-100);width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--brown-800)\"><i data-lucide=\"x\" style=\"width:18px;height:18px\"></i></button>\n            </div>\n            <sc-if value=\"{{ selectedServiceTitle }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"background:var(--tan-100);color:var(--text-muted);font-size:13px;padding:10px 13px;border-radius:11px;line-height:1.4\">Заявка по услуге: <strong style=\"color:var(--text-strong)\">{{ selectedServiceTitle }}</strong></div>\n            </sc-if>\n            <input placeholder=\"Фамилия, имя, отчество\" style=\"width:100%;padding:13px 15px;border:1px solid var(--border-strong);border-radius:13px;font-size:15px;font-family:inherit;background:var(--bg)\">\n            <input placeholder=\"Телефон\" style=\"width:100%;padding:13px 15px;border:1px solid var(--border-strong);border-radius:13px;font-size:15px;font-family:inherit;background:var(--bg)\">\n            <input placeholder=\"Электронная почта\" style=\"width:100%;padding:13px 15px;border:1px solid var(--border-strong);border-radius:13px;font-size:15px;font-family:inherit;background:var(--bg)\">\n            <textarea placeholder=\"Кратко опишите вопрос (необязательно)\" rows=\"3\" style=\"width:100%;padding:13px 15px;border:1px solid var(--border-strong);border-radius:13px;font-size:15px;font-family:inherit;background:var(--bg);resize:vertical\"></textarea>\n            <button class=\"mb-btn\" sc-camel-on-click=\"{{ submitModal }}\" style=\"border:none;cursor:pointer;background:var(--coral-600);color:#fff;font-weight:700;font-size:16px;padding:14px;border-radius:13px;width:100%\" style-hover=\"background:var(--coral-700)\">Отправить заявку</button>\n          </div>\n        </sc-if>\n      </div>\n    </div>\n  </sc-if>\n\n</div>\n</x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { audience: \"all\", cats: [], modalOpen: false, sent: false, menuOpen: false, services: [], selectedService: null };\n\n  componentDidMount() {\n    const poll = () => {\n      if (window.MB_SERVICES) this.setState({ services: window.MB_SERVICES });\n      else this._p = setTimeout(poll, 60);\n    };\n    poll();\n    try {\n      const p = new URLSearchParams(location.search);\n      const a = p.get(\"audience\");\n      if (a && [\"start\", \"self\", \"business\", \"export\", \"producers\", \"veterans\"].includes(a)) {\n        this.setState({ audience: a });\n      }\n    } catch (e) {}\n    this._draw();\n  }\n\n  componentDidUpdate() { this._draw(); }\n  componentWillUnmount() { clearTimeout(this._t); clearTimeout(this._p); }\n\n  _draw() {\n    clearTimeout(this._t);\n    this._t = setTimeout(() => { if (window.lucide) window.lucide.createIcons(); }, 60);\n  }\n\n  renderVals() {\n    const CATS = [\n      { key: \"promo\", title: \"Продвижение\", icon: \"megaphone\" },\n      { key: \"tech\", title: \"Технологии и сервисы\", icon: \"cpu\" },\n      { key: \"consult\", title: \"Консультации\", icon: \"messages-square\" },\n      { key: \"finance\", title: \"Финансы\", icon: \"banknote\" },\n      { key: \"education\", title: \"Обучение\", icon: \"graduation-cap\" },\n      { key: \"foreign\", title: \"Выход на зарубежные рынки\", icon: \"globe\" },\n      { key: \"property\", title: \"Имущество\", icon: \"building-2\" },\n      { key: \"infra\", title: \"Инфраструктура\", icon: \"network\" },\n    ];\n\n    const AUD = [\n      { key: \"all\", label: \"Все\" },\n      { key: \"start\", label: \"Желающим открыть бизнес\" },\n      { key: \"business\", label: \"Действующим ИП, юрлицам, работодателям\" },\n      { key: \"producers\", label: \"Производителям, фермерам, инноваторам\" },\n      { key: \"self\", label: \"Самозанятым\" },\n      { key: \"export\", label: \"Экспортёрам\" },\n      { key: \"veterans\", label: \"Ветеранам СВО и их семьям\" },\n    ];\n\n    const DEPT = {\n      \"ЦПП\": \"Центр поддержки предпринимательства\",\n      \"КЦ\": \"Консультационный центр\",\n      \"ФРП\": \"Фонд развития промышленности\",\n      \"ЦКСХ\": \"Центр компетенций в сфере сельхозкооперации\",\n      \"РЦК\": \"Региональный центр компетенций\",\n      \"ИИЦ\": \"Инновационно-инжиниринговый центр\",\n      \"ФМФ\": \"Фонд микрофинансирования\",\n      \"ГФ\": \"Гарантийный фонд\",\n      \"ЦИСС\": \"Центр инноваций социальной сферы\",\n      \"ЦКР\": \"Центр кластерного развития\",\n      \"ЦПЭ\": \"Центр поддержки экспорта\",\n      \"ЦКИ\": \"Центр креативных индустрий\",\n    };\n\n    const S = this.state.services.map(s => ({ ...s, deptName: DEPT[s.dept] || s.dept }));\n\n    const STATUS = {\n      open: { label: \"Идёт приём заявок\", color: \"var(--success)\", bg: \"rgba(0,190,55,.12)\" },\n      closed: { label: \"Архив / завершено\", color: \"var(--text-muted)\", bg: \"var(--tan-100)\" },\n      holded: { label: \"Приём временно приостановлен\", color: \"#8a6a1f\", bg: \"rgba(201,150,46,.18)\" },\n    };\n\n    const aud = this.state.audience;\n    const cats = this.state.cats;\n    const openModal = (s) => this.setState({ modalOpen: true, sent: false, selectedService: s || null });\n\n    const ORDER = { open: 0, holded: 1, closed: 2 };\n    const audKey = aud === \"veterans\" ? \"start\" : aud;\n    const visible = S.filter(s =>\n      (aud === \"all\" || s.aud.includes(audKey)) &&\n      (cats.length === 0 || s.cats.some(c => cats.includes(c)))\n    );\n\n    const groups = CATS\n      .map(c => ({\n        ...c,\n        items: visible.filter(s => s.cats.includes(c.key))\n          .sort((a, b) => (ORDER[a.status] ?? 9) - (ORDER[b.status] ?? 9))\n          .map(s => {\n            const st = STATUS[s.status];\n            return { ...s, statusLabel: st.label, statusColor: st.color, statusBg: st.bg, openModal: () => openModal(s) };\n          }),\n      }))\n      .filter(c => c.items.length > 0 && (cats.length === 0 || cats.includes(c.key)))\n      .map(c => ({ ...c, countLabel: c.items.length + (c.items.length === 1 ? \" услуга\" : (c.items.length < 5 ? \" услуги\" : \" услуг\")) }));\n\n    const audLabel = AUD.find(a => a.key === aud);\n\n    return {\n      menuOpen: this.state.menuOpen,\n      navLinks: [\n        { label: \"О Центре\", href: \"o-centre.html\" },\n        { label: \"Услуги\", href: \"uslugi.html\" },\n        { label: \"Мероприятия\", href: \"meropriyatiya.html\" },\n        { label: \"Новости\", href: \"novosti.html\" },\n        { label: \"Истории успеха\", href: \"index.html#stories\" },\n        { label: \"Контакты\", href: \"index.html#contacts\" },\n      ],\n      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),\n      closeMenu: () => this.setState({ menuOpen: false }),\n      openModalFromMenu: () => this.setState({ menuOpen: false, modalOpen: true, sent: false }),\n      audienceRadios: AUD.map(a => ({\n        label: a.label,\n        onClick: () => this.setState({ audience: a.key }),\n        ring: aud === a.key ? \"var(--coral-600)\" : \"var(--border-strong)\",\n        dot: aud === a.key ? \"var(--coral-600)\" : \"transparent\",\n        color: aud === a.key ? \"var(--text-strong)\" : \"var(--text-body)\",\n        weight: aud === a.key ? \"700\" : \"500\",\n      })),\n      categoryChecks: CATS.map(c => {\n        const on = cats.includes(c.key);\n        return {\n          label: c.title,\n          onClick: () => this.setState(s => ({ cats: s.cats.includes(c.key) ? s.cats.filter(x => x !== c.key) : [...s.cats, c.key] })),\n          ring: on ? \"var(--coral-600)\" : \"var(--border-strong)\",\n          fill: on ? \"var(--coral-600)\" : \"transparent\",\n          checkOpacity: on ? \"1\" : \"0\",\n          color: on ? \"var(--text-strong)\" : \"var(--text-body)\",\n          weight: on ? \"700\" : \"500\",\n        };\n      }),\n      resetFilters: () => this.setState({ audience: \"all\", cats: [] }),\n      groups,\n      totalCount: visible.length,\n      showEmpty: visible.length === 0,\n      audienceLabel: aud === \"all\" ? \"Все аудитории\" : (audLabel ? audLabel.label : \"\"),\n      vetBanner: aud === \"veterans\",\n\n      modalOpen: this.state.modalOpen,\n      modalForm: this.state.modalOpen && !this.state.sent,\n      modalSent: this.state.modalOpen && this.state.sent,\n      openModal,\n      closeModal: () => this.setState({ modalOpen: false, sent: false, selectedService: null }),\n      submitModal: () => this.setState({ sent: true }),\n      selectedServiceTitle: this.state.selectedService ? this.state.selectedService.title : \"\",\n      stop: (e) => e.stopPropagation(),\n\n      socials: [\"send\", \"play-circle\", \"rss\", \"users\"],\n    };\n  }\n}\n<\u002Fscript>\n\n\n</body></html>"
  </script>

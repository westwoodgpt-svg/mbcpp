    const templateEl = document.querySelector('script[type="__bundler/template"]');

    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);

            const reader = ds.readable.getReader();

            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);

      template = template.slice(0, i) + resourceScript + template.slice(i);

    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);

      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);

      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.

    // which fired before we swapped the document. Trigger manually if present.

      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"d4300b95-809e-4d68-9d7c-28bf6a0d347f\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n<\u002Fstyle>\n<style>/* Мой бизнес — Color tokens\n   Derived from the official logo: coffee-brown wordmark, tan rocket, coral flame. */\n:root {\n  /* ---- Brand core ---- */\n  --brown-900: #3a221d;\n  --brown-800: #4d2f2a;   /* primary wordmark brown (logo) */\n  --brown-700: #5e3a32;\n  --brown-600: #6f463b;\n  --brown-500: #8a5d4f;\n\n  --tan-700: #b07d4e;\n  --tan-600: #c08b59;\n  --tan-500: #cf9e70;     /* signature tan / rocket body (logo) */\n  --tan-400: #dcb288;\n  --tan-300: #e8cba8;\n  --tan-200: #f2e0cb;\n  --tan-100: #f8eede;     /* warm cream surface */\n\n  --coral-700: #c23f2c;\n  --coral-600: #dd4b33;   /* accent flame (logo) */\n  --coral-500: #e05040;\n  --coral-400: #ea7361;\n\n  /* ---- Neutrals (warm-tinted greys) ---- */\n  --ink-900: #2a201d;\n  --ink-700: #4f433e;\n  --ink-500: #7a6d66;\n  --ink-300: #b3a9a2;\n  --ink-200: #d9d1cb;\n  --ink-100: #ece7e2;\n  --paper: #ffffff;\n  --bg: #faf6f1;          /* page background, faint warm */\n\n  /* ---- Semantic ---- */\n  --success: #2e8b57;\n  --warning: #e0992f;\n  --danger: var(--coral-600);\n  --info: #3a72b0;\n\n  /* ---- Aliases ---- */\n  --color-primary: var(--brown-800);\n  --color-primary-hover: var(--brown-900);\n  --color-accent: var(--coral-600);\n  --color-accent-hover: var(--coral-700);\n  --color-secondary: var(--tan-500);\n\n  --text-strong: var(--ink-900);\n  --text-body: var(--ink-700);\n  --text-muted: var(--ink-500);\n  --text-on-dark: #fbf6f0;\n  --text-on-accent: #ffffff;\n\n  --surface-page: var(--bg);\n  --surface-card: var(--paper);\n  --surface-warm: var(--tan-100);\n  --surface-brand: var(--brown-800);\n\n  --border-subtle: var(--ink-200);\n  --border-strong: var(--ink-300);\n  --focus-ring: var(--coral-500);\n}\n<\u002Fstyle>\n<style>/* Мой бизнес — Typography tokens\n   Substitution: Manrope (Google Fonts) stands in for the brand's geometric sans\n   until the official font files are supplied. Manrope ships full Cyrillic. */\n:root {\n  --font-sans: \"Manrope\", \"Segoe UI\", \"Helvetica Neue\", Arial, sans-serif;\n  --font-display: \"Manrope\", \"Segoe UI\", Arial, sans-serif;\n\n  /* Weights */\n  --fw-regular: 400;   /* @kind font */\n  --fw-medium: 500;    /* @kind font */\n  --fw-semibold: 600;  /* @kind font */\n  --fw-bold: 700;      /* @kind font */\n  --fw-extrabold: 800; /* @kind font */\n\n  /* Type scale (1.25 major-third-ish, tuned) */\n  --fs-display: 56px;\n  --fs-h1: 40px;\n  --fs-h2: 30px;\n  --fs-h3: 23px;\n  --fs-h4: 19px;\n  --fs-body-lg: 18px;\n  --fs-body: 16px;\n  --fs-sm: 14px;\n  --fs-xs: 12px;\n\n  /* Line heights */\n  --lh-tight: 1.1;     /* @kind font */\n  --lh-heading: 1.2;   /* @kind font */\n  --lh-body: 1.55;     /* @kind font */\n\n  /* Letter spacing */\n  --ls-display: -0.02em; /* @kind font */\n  --ls-heading: -0.01em; /* @kind font */\n  --ls-label: 0.04em;    /* @kind font */\n}\n<\u002Fstyle>\n<style>/* Мой бизнес — Spacing, radius, shadow, layout tokens */\n:root {\n  /* Spacing scale (4px base) */\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 24px;\n  --space-6: 32px;\n  --space-7: 48px;\n  --space-8: 64px;\n  --space-9: 96px;\n\n  /* Radius — brand leans friendly/rounded */\n  --radius-sm: 8px;\n  --radius-md: 14px;\n  --radius-lg: 20px;\n  --radius-xl: 28px;\n  --radius-pill: 999px;\n\n  /* Shadows — soft warm-tinted */\n  --shadow-sm: 0 1px 2px rgba(58, 34, 29, 0.06), 0 1px 3px rgba(58, 34, 29, 0.08);\n  --shadow-md: 0 4px 12px rgba(58, 34, 29, 0.08), 0 2px 4px rgba(58, 34, 29, 0.06);\n  --shadow-lg: 0 12px 32px rgba(58, 34, 29, 0.12), 0 4px 8px rgba(58, 34, 29, 0.06);\n  --shadow-accent: 0 8px 20px rgba(221, 75, 51, 0.28);\n\n  /* Layout */\n  --container: 1200px;        /* @kind spacing */\n  --container-narrow: 800px;  /* @kind spacing */\n\n  /* Motion */\n  --ease-standard: cubic-bezier(0.22, 0.61, 0.36, 1); /* @kind other */\n  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */\n  --dur-fast: 140ms;  /* @kind other */\n  --dur-base: 220ms;  /* @kind other */\n  --dur-slow: 360ms;  /* @kind other */\n}\n<\u002Fstyle>\n<style>/* Мой бизнес — Base element styles & helpers (optional reset layer). */\n* { box-sizing: border-box; }\n\nbody {\n  margin: 0;\n  font-family: var(--font-sans);\n  font-size: var(--fs-body);\n  line-height: var(--lh-body);\n  color: var(--text-body);\n  background: var(--surface-page);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\nh1, h2, h3, h4 {\n  font-family: var(--font-display);\n  color: var(--text-strong);\n  line-height: var(--lh-heading);\n  margin: 0 0 var(--space-4);\n}\nh1 { font-size: var(--fs-h1); font-weight: var(--fw-extrabold); letter-spacing: var(--ls-heading); }\nh2 { font-size: var(--fs-h2); font-weight: var(--fw-bold); letter-spacing: var(--ls-heading); }\nh3 { font-size: var(--fs-h3); font-weight: var(--fw-bold); }\nh4 { font-size: var(--fs-h4); font-weight: var(--fw-semibold); }\n\np { margin: 0 0 var(--space-4); text-wrap: pretty; }\n\na { color: var(--color-accent); text-decoration: none; }\na:hover { color: var(--color-accent-hover); }\n\n.mb-eyebrow {\n  font-size: var(--fs-xs);\n  font-weight: var(--fw-bold);\n  letter-spacing: var(--ls-label);\n  text-transform: uppercase;\n  color: var(--color-accent);\n}\n\n.mb-container { max-width: var(--container); margin-inline: auto; padding-inline: var(--space-5); }\n<\u002Fstyle>\n<sty 0, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"d4300b95-809e-4d68-9d7c-28bf6a0d347f\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* Мой бизнес — Color tokens\n   Derived from the official logo: coffee-brown wordmark, tan rocket, coral flame. */\n:root {\n  /* ---- Brand core ---- */\n  --brown-900: #3a221d;\n  --brown-800: #4d2f2a;   /* primary wordmark brown (logo) */\n  --brown-700: #5e3a32;\n  --brown-600: #6f463b;\n  --brown-500: #8a5d4f;\n\n  --tan-700: #b07d4e;\n  --tan-600: #c08b59;\n  --tan-500: #cf9e70;     /* signature tan / rocket body (logo) */\n  --tan-400: #dcb288;\n  --tan-300: #e8cba8;\n  --tan-200: #f2e0cb;\n  --tan-100: #f8eede;     /* warm cream surface */\n\n  --coral-700: #c23f2c;\n  --coral-600: #dd4b33;   /* accent flame (logo) */\n  --coral-500: #e05040;\n  --coral-400: #ea7361;\n\n  /* ---- Neutrals (warm-tinted greys) ---- */\n  --ink-900: #2a201d;\n  --ink-700: #4f433e;\n  --ink-500: #7a6d66;\n  --ink-300: #b3a9a2;\n  --ink-200: #d9d1cb;\n  --ink-100: #ece7e2;\n  --paper: #ffffff;\n  --bg: #faf6f1;          /* page background, faint warm */\n\n  /* ---- Semantic ---- */\n  --success: #2e8b57;\n  --warning: #e0992f;\n  --danger: var(--coral-600);\n  --info: #3a72b0;\n\n  /* ---- Aliases ---- */\n  --color-primary: var(--brown-800);\n  --color-primary-hover: var(--brown-900);\n  --color-accent: var(--coral-600);\n  --color-accent-hover: var(--coral-700);\n  --color-secondary: var(--tan-500);\n\n  --text-strong: var(--ink-900);\n  --text-body: var(--ink-700);\n  --text-muted: var(--ink-500);\n  --text-on-dark: #fbf6f0;\n  --text-on-accent: #ffffff;\n\n  --surface-page: var(--bg);\n  --surface-card: var(--paper);\n  --surface-warm: var(--tan-100);\n  --surface-brand: var(--brown-800);\n\n  --border-subtle: var(--ink-200);\n  --border-strong: var(--ink-300);\n  --focus-ring: var(--coral-500);\n}\n\n/* Мой бизнес — Typography tokens\n   Substitution: Manrope (Google Fonts) stands in for the brand's geometric sans\n   until the official font files are supplied. Manrope ships full Cyrillic. */\n:root {\n  --font-sans: \"Manrope\", \"Segoe UI\", \"Helvetica Neue\", Arial, sans-serif;\n  --font-display: \"Manrope\", \"Segoe UI\", Arial, sans-serif;\n\n  /* Weights */\n  --fw-regular: 400;   /* @kind font */\n  --fw-medium: 500;    /* @kind font */\n  --fw-semibold: 600;  /* @kind font */\n  --fw-bold: 700;      /* @kind font */\n  --fw-extrabold: 800; /* @kind font */\n\n  /* Type scale (1.25 major-third-ish, tuned) */\n  --fs-display: 56px;\n  --fs-h1: 40px;\n  --fs-h2: 30px;\n  --fs-h3: 23px;\n  --fs-h4: 19px;\n  --fs-body-lg: 18px;\n  --fs-body: 16px;\n  --fs-sm: 14px;\n  --fs-xs: 12px;\n\n  /* Line heights */\n  --lh-tight: 1.1;     /* @kind font */\n  --lh-heading: 1.2;   /* @kind font */\n  --lh-body: 1.55;     /* @kind font */\n\n  /* Letter spacing */\n  --ls-display: -0.02em; /* @kind font */\n  --ls-heading: -0.01em; /* @kind font */\n  --ls-label: 0.04em;    /* @kind font */\n}\n\n/* Мой бизнес — Spacing, radius, shadow, layout tokens */\n:root {\n  /* Spacing scale (4px base) */\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 24px;\n  --space-6: 32px;\n  --space-7: 48px;\n  --space-8: 64px;\n  --space-9: 96px;\n\n  /* Radius — brand leans friendly/rounded */\n  --radius-sm: 8px;\n  --radius-md: 14px;\n  --radius-lg: 20px;\n  --radius-xl: 28px;\n  --radius-pill: 999px;\n\n  /* Shadows — soft warm-tinted */\n  --shadow-sm: 0 1px 2px rgba(58, 34, 29, 0.06), 0 1px 3px rgba(58, 34, 29, 0.08);\n  --shadow-md: 0 4px 12px rgba(58, 34, 29, 0.08), 0 2px 4px rgba(58, 34, 29, 0.06);\n  --shadow-lg: 0 12px 32px rgba(58, 34, 29, 0.12), 0 4px 8px rgba(58, 34, 29, 0.06);\n  --shadow-accent: 0 8px 20px rgba(221, 75, 51, 0.28);\n\n  /* Layout */\n  --container: 1200px;        /* @kind spacing */\n  --container-narrow: 800px;  /* @kind spacing */\n\n  /* Motion */\n  --ease-standard: cubic-bezier(0.22, 0.61, 0.36, 1); /* @kind other */\n  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */\n  --dur-fast: 140ms;  /* @kind other */\n  --dur-base: 220ms;  /* @kind other */\n  --dur-slow: 360ms;  /* @kind other */\n}\n\n/* Мой бизнес — Base element styles & helpers (optional reset layer). */\n* { box-sizing: border-box; }\n\nbody {\n  margin: 0;\n  font-family: var(--font-sans);\n  font-size: var(--fs-body);\n  line-height: var(--lh-body);\n  color: var(--text-body);\n  background: var(--surface-page);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\nh1, h2, h3, h4 {\n  font-family: var(--font-display);\n  color: var(--text-strong);\n  line-height: var(--lh-heading);\n  margin: 0 0 var(--space-4);\n}\nh1 { font-size: var(--fs-h1); font-weight: var(--fw-extrabold); letter-spacing: var(--ls-heading); }\nh2 { font-size: var(--fs-h2); font-weight: var(--fw-bold); letter-spacing: var(--ls-heading); }\nh3 { font-size: var(--fs-h3); font-weight: var(--fw-bold); }\nh4 { font-size: var(--fs-h4); font-weight: var(--fw-semibold); }\n\np { margin: 0 0 var(--space-4); text-wrap: pretty; }\n\na { color: var(--color-accent); text-decoration: none; }\na:hover { color: var(--color-accent-hover); }\n\n.mb-eyebrow {\n  font-size: var(--fs-xs);\n  font-weight: var(--fw-bold);\n  letter-spacing: var(--ls-label);\n  text-transform: uppercase;\n  color: var(--color-accent);\n}\n\n.mb-container { max-width: var(--container); margin-inline: auto; padding-inline: var(--space-5); }\n\n<\u002Fstyle>\n<script src=\"dc2620af-fbbb-4b41-ab44-488f9c40871a\"><\u002Fscript>\n<script src=\"324dea04-9ce8-415d-b2e8-d4e82b3c95da\"><\u002Fscript>\n<script src=\"fe72e68b-74b6-49cd-ab92-6f6ce80c1f8e\"><\u002Fscript>\n<style>\n  html,body{margin:0;background:var(--bg);color:var(--text-body);font-family:var(--font-sans,'Manrope',sans-serif)}\n  *{box-sizing:border-box}\n  a{color:inherit;text-decoration:none}\n  .mb-link{transition:color .15s}\n  .mb-link:hover{color:var(--coral-600)}\n  .mb-card{transition:transform .2s ease,box-shadow .2s ease}\n  .mb-card:hover{transform:translateY(-4px);box-shadow:0 16px 40px -18px rgba(58,34,29,.35)}\n  .mb-btn{transition:background .15s,transform .1s,box-shadow .15s}\n  .mb-btn:active{transform:scale(.98)}\n  @keyframes mbrise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}\n  @keyframes mbfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}\n  @keyframes mbpulse{0%,100%{box-shadow:0 12px 30px -10px rgba(221,75,51,.7)}50%{box-shadow:0 12px 40px -6px rgba(221,75,51,.95)}}\n  .mb-menu-btn{display:none}\n  /* ===== Responsive ===== */\n  @media (max-width:760px){\n    [style*=\"max-width: 1240px\"]{padding-left:18px!important;padding-right:18px!important}\n    [style*=\"grid-template-columns: 300px 1fr\"]{grid-template-columns:1fr!important;gap:24px!important}\n    [style*=\"grid-template-columns: repeat(2, 1fr)\"]{grid-template-columns:1fr!important}\n    [style*=\"grid-template-columns: 1.5fr 1fr 1.2fr\"]{grid-template-columns:1fr!important}\n    [style*=\"position: sticky; top: 96px\"]{position:static!important;top:auto!important}\n    .mb-card-actions{flex-direction:column!important}\n    [style*=\"font-size: 52px\"]{font-size:32px!important}\n    [style*=\"font-size: 30px\"]{font-size:24px!important}\n    [style*=\"padding: 48px;\"]{padding:28px!important}\n    .mb-nav{display:none!important}\n    .mb-header-cta{display:none!important}\n    .mb-menu-btn{display:inline-flex!important}\n    .mb-topbar-collapse{display:none!important}\n  }\n<\u002Fstyle>\n\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;overflow-x:hidden\">\n\n  <!-- Top bar -->\n  <div style=\"background:var(--brown-900);color:rgba(251,246,240,.82);font-size:13px\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:9px 32px;display:flex;align-items:center;gap:20px;flex-wrap:wrap\">\n      <span style=\"color:var(--tan-400)\">Центр поддержки предпринимательства Калининградской области<\u002Fspan>\n      <div style=\"margin-left:auto;display:flex;align-items:center;gap:18px\" class=\"mb-topbar-collapse\">\n        <a class=\"mb-link\" href=\"tel:+74012994588\" style=\"display:flex;align-items:center;gap:6px\"><i data-lucide=\"phone\" style=\"width:14px;height:14px\"><\u002Fi>+7 (4012) 994&nbsp;588<\u002Fa>\n        <a class=\"mb-link\" href=\"mailto:info@mbkaliningrad.ru\" style=\"display:flex;align-items:center;gap:6px\"><i data-lucide=\"mail\" style=\"width:14px;height:14px\"><\u002Fi>info@mbkaliningrad.ru<\u002Fa>\n        <a class=\"mb-link\" href=\"#\" style=\"display:flex;align-items:center;gap:6px;color:var(--tan-400)\"><i data-lucide=\"eye\" style=\"width:14px;height:14px\"><\u002Fi>Версия для слабовидящих<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Header -->\n  <header style=\"position:sticky;top:0;z-index:40;background:rgba(250,246,241,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border-subtle)\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:0 32px;display:flex;align-items:center;gap:28px;height:78px\">\n      <a href=\"Лендинг Мой бизнес.dc.html\" style=\"display:flex;align-items:center\"><img src=\"7df9e2c5-e0a2-4e29-a447-a9b4e59e5ad8\" alt=\"Мой бизнес — Калининград\" style=\"height:46px\"><\u002Fa>\n      <nav class=\"mb-nav\" style=\"display:flex;gap:24px;margin-left:auto\">\n        <a class=\"mb-link\" href=\"Лендинг Мой бизнес.dc.html#about\" style=\"font-weight:600;font-size:15px\">О Центре<\u002Fa>\n        <a class=\"mb-link\" href=\"Услуги.dc.html\" style=\"font-weight:700;font-size:15px;color:var(--coral-600)\">Услуги<\u002Fa>\n        <a class=\"mb-link\" href=\"Лендинг Мой бизнес.dc.html#events\" style=\"font-weight:600;font-size:15px\">Мероприятия<\u002Fa>\n        <a class=\"mb-link\" href=\"Лендинг Мой бизнес.dc.html#news\" style=\"font-weight:600;font-size:15px\">Новости<\u002Fa>\n        <a class=\"mb-link\" href=\"Лендинг Мой бизнес.dc.html#stories\" style=\"font-weight:600;font-size:15px\">Истории успеха<\u002Fa>\n        <a class=\"mb-link\" href=\"Лендинг Мой бизнес.dc.html#contacts\" style=\"font-weight:600;font-size:15px\">Контакты<\u002Fa>\n      <\u002Fnav>\n      <button class=\"mb-btn mb-header-cta\" onclick=\"{{ openModal }}\" style=\"border:none;cursor:pointer;background:var(--coral-600);color:#fff;font-weight:700;font-size:15px;padding:11px 22px;border-radius:13px;box-shadow:0 8px 20px -8px rgba(221,75,51,.6)\" style-hover=\"background:var(--coral-700)\">Получить поддержку<\u002Fbutton>\n      <button class=\"mb-btn mb-menu-btn\" onclick=\"{{ toggleMenu }}\" aria-label=\"Меню\" style=\"margin-left:auto;border:none;cursor:pointer;background:transparent;color:var(--brown-900);padding:6px;align-items:center\"><i data-lucide=\"menu\" style=\"width:28px;height:28px\"><\u002Fi><\u002Fbutton>\n    <\u002Fdiv>\n    <sc-if value=\"{{ menuOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"border-top:1px solid var(--border-subtle);background:var(--bg);padding:10px 18px 18px;display:flex;flex-direction:column;gap:2px\">\n        <sc-for list=\"{{ navLinks }}\" as=\"n\" hint-placeholder-count=\"6\">\n          <a class=\"mb-link\" href=\"{{ n.href }}\" onclick=\"{{ closeMenu }}\" style=\"font-weight:600;font-size:17px;padding:12px 6px;border-bottom:1px solid var(--border-subtle)\">{{ n.label }}<\u002Fa>\n        <\u002Fsc-for>\n        <button class=\"mb-btn\" onclick=\"{{ openModalFromMenu }}\" style=\"margin-top:12px;border:none;cursor:pointer;background:var(--coral-600);color:#fff;font-weight:700;font-size:16px;padding:14px 22px;border-radius:13px\">Получить поддержку<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fheader>\n\n  <!-- HEADING -->\n  <section style=\"background:var(--brown-800);color:#fff;position:relative;overflow:hidden\">\n    <div style=\"position:absolute;right:-120px;top:-160px;width:480px;height:480px;border-radius:50%;background:radial-gradient(circle,rgba(207,158,112,.4),transparent 64%);pointer-events:none\"><\u002Fdiv>\n    <div style=\"position:absolute;right:9%;top:54%;transform:translateY(-50%);font-size:200px;opacity:.1;color:var(--tan-400);animation:mbfloat 6s ease-in-out infinite;pointer-events:none\"><i data-lucide=\"rocket\" style=\"width:200px;height:200px\"><\u002Fi><\u002Fdiv>\n    <div style=\"max-width:1240px;margin:0 auto;padding:30px 32px 56px;position:relative;z-index:1\">\n      <div style=\"display:flex;align-items:center;gap:8px;font-size:13px;color:rgba(251,246,240,.7);margin-bottom:26px\">\n        <a class=\"mb-link\" href=\"Лендинг Мой бизнес.dc.html\" style=\"color:rgba(251,246,240,.7)\">Главная<\u002Fa>\n        <i data-lucide=\"chevron-right\" style=\"width:14px;height:14px\"><\u002Fi>\n        <span style=\"color:var(--tan-400)\">Услуги<\u002Fspan>\n      <\u002Fdiv>\n      <span style=\"display:inline-flex;align-items:center;gap:8px;background:var(--coral-600);color:#fff;font-size:13px;font-weight:700;padding:7px 15px;border-radius:999px;margin-bottom:18px;animation:mbrise .5s ease both\"><i data-lucide=\"sparkles\" style=\"width:15px;height:15px\"><\u002Fi>161 167 услуг оказано предпринимателям<\u002Fspan>\n      <h1 style=\"margin:0;max-width:760px;font-size:52px;font-weight:800;line-height:1.06;letter-spacing:-.02em;animation:mbrise .55s ease .08s both\">Полный спектр услуг для развития вашего бизнеса<\u002Fh1>\n      <p style=\"margin:18px 0 28px;max-width:600px;font-size:19px;line-height:1.55;color:rgba(251,246,240,.86);animation:mbrise .6s ease .18s both\">От оформления документов до выхода на зарубежные рынки — помогаем бизнесу на всех этапах. Все услуги центра бесплатны.<\u002Fp>\n      <button class=\"mb-btn\" onclick=\"{{ openModal }}\" style=\"border:none;cursor:pointer;background:var(--coral-600);color:#fff;font-weight:700;font-size:17px;padding:15px 32px;border-radius:14px;box-shadow:0 12px 28px -10px rgba(221,75,51,.7);animation:mbrise .6s ease .28s both\" style-hover=\"background:var(--coral-700)\">Получить поддержку<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- CONTENT: filter + list -->\n  <section style=\"max-width:1240px;margin:0 auto;padding:48px 32px 80px;display:grid;grid-template-columns:300px 1fr;gap:40px;align-items:start\">\n\n    <!-- Sidebar filter -->\n    <aside style=\"position:sticky;top:96px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:20px;padding:26px 24px\">\n      <h3 style=\"margin:0 0 4px;font-size:20px;font-weight:800;color:var(--text-strong)\">Найти услугу<\u002Fh3>\n      <p style=\"margin:0 0 22px;font-size:13px;color:var(--text-muted)\">Отфильтруйте по аудитории и категории<\u002Fp>\n\n      <div style=\"font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--coral-600);margin-bottom:12px\">Кому<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;margin-bottom:24px\">\n        <sc-for list=\"{{ audienceRadios }}\" as=\"a\" hint-placeholder-count=\"6\">\n          <button onclick=\"{{ a.onClick }}\" class=\"mb-btn\" style=\"display:flex;align-items:center;gap:11px;width:100%;text-align:left;cursor:pointer;background:transparent;border:none;padding:8px 0;font-family:inherit\">\n            <span style=\"flex:none;width:20px;height:20px;border-radius:50%;border:2px solid {{ a.ring }};display:flex;align-items:center;justify-content:center\"><span style=\"width:10px;height:10px;border-radius:50%;background:{{ a.dot }}\"><\u002Fspan><\u002Fspan>\n            <span style=\"font-size:14px;font-weight:{{ a.weight }};color:{{ a.color }};line-height:1.3\">{{ a.label }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"height:1px;background:var(--border-subtle);margin-bottom:20px\"><\u002Fdiv>\n\n      <div style=\"font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--coral-600);margin-bottom:12px\">Категория<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;margin-bottom:24px\">\n        <sc-for list=\"{{ categoryChecks }}\" as=\"c\" hint-placeholder-count=\"6\">\n          <button onclick=\"{{ c.onClick }}\" class=\"mb-btn\" style=\"display:flex;align-items:center;gap:11px;width:100%;text-align:left;cursor:pointer;background:transparent;border:none;padding:8px 0;font-family:inherit\">\n            <span style=\"flex:none;width:20px;height:20px;border-radius:6px;border:2px solid {{ c.ring }};background:{{ c.fill }};display:flex;align-items:center;justify-content:center;color:#fff\"><i data-lucide=\"check\" style=\"width:13px;height:13px;opacity:{{ c.checkOpacity }}\"><\u002Fi><\u002Fspan>\n            <span style=\"font-size:14px;font-weight:{{ c.weight }};color:{{ c.color }};line-height:1.3\">{{ c.label }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <button onclick=\"{{ resetFilters }}\" class=\"mb-btn\" style=\"width:100%;cursor:pointer;border:1px solid var(--border-strong);background:transparent;color:var(--brown-800);font-weight:700;font-size:14px;padding:11px;border-radius:12px\" style-hover=\"background:var(--tan-100)\">Сбросить фильтры<\u002Fbutton>\n    <\u002Faside>\n\n    <!-- Results -->\n    <div>\n      <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:8px;flex-wrap:wrap\">\n        <div style=\"font-size:15px;color:var(--text-muted)\">Найдено услуг: <strong style=\"color:var(--text-strong)\">{{ totalCount }}<\u002Fstrong><\u002Fdiv>\n        <div style=\"font-size:14px;color:var(--text-muted)\">{{ audienceLabel }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"height:1px;background:var(--border-subtle);margin-bottom:30px\"><\u002Fdiv>\n\n      <sc-if value=\"{{ vetBanner }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:linear-gradient(120deg,var(--brown-800),var(--brown-900));color:#fff;border-radius:20px;padding:28px 30px;margin-bottom:34px;display:flex;align-items:center;gap:22px;flex-wrap:wrap;position:relative;overflow:hidden\">\n          <div style=\"position:absolute;right:-40px;top:-40px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(207,158,112,.4),transparent 65%);pointer-events:none\"><\u002Fdiv>\n          <div style=\"width:58px;height:58px;border-radius:16px;background:var(--coral-600);display:flex;align-items:center;justify-content:center;flex:none;position:relative;z-index:1\"><i data-lucide=\"medal\" style=\"width:30px;height:30px;color:#fff\"><\u002Fi><\u002Fdiv>\n          <div style=\"flex:1;min-width:240px;position:relative;z-index:1\">\n            <div style=\"font-size:21px;font-weight:800;margin-bottom:5px\">Ветеранам СВО и их семьям<\u002Fdiv>\n            <div style=\"font-size:15px;color:rgba(251,246,240,.85);line-height:1.5\">Хотите начать своё дело? Оставьте заявку — поможем с регистрацией, обучением и финансированием на старте.<\u002Fdiv>\n          <\u002Fdiv>\n          <button class=\"mb-btn\" onclick=\"{{ openModal }}\" style=\"position:relative;z-index:1;border:none;cursor:pointer;background:var(--coral-600);color:#fff;font-weight:700;font-size:15px;padding:13px 26px;border-radius:13px\" style-hover=\"background:var(--coral-700)\">Оставить заявку<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-for list=\"{{ groups }}\" as=\"g\" hint-placeholder-count=\"3\">\n        <div style=\"margin-bottom:42px\">\n          <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:20px\">\n            <div style=\"width:46px;height:46px;border-radius:13px;background:var(--tan-100);color:var(--coral-600);display:flex;align-items:center;justify-content:center;flex:none\"><i data-lucide=\"{{ g.icon }}\" style=\"width:24px;height:24px\"><\u002Fi><\u002Fdiv>\n            <h2 style=\"margin:0;font-size:26px;font-weight:800;color:var(--text-strong)\">{{ g.title }}<\u002Fh2>\n            <span style=\"font-size:14px;color:var(--text-muted)\">{{ g.countLabel }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:18px\">\n            <sc-for list=\"{{ g.items }}\" as=\"s\" hint-placeholder-count=\"2\">\n              <div class=\"mb-card\" style=\"display:flex;flex-direction:column;gap:13px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:18px;padding:24px;position:relative\">\n                <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px\">\n                  <span style=\"font-size:12px;font-weight:700;color:var(--brown-700);background:var(--tan-100);padding:4px 11px;border-radius:999px\">{{ s.forma }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font-weight:700;font-size:18px;color:var(--text-strong);line-height:1.3;min-height:47px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden\">{{ s.title }}<\u002Fdiv>\n                <div style=\"font-size:14px;color:var(--text-muted);line-height:1.5;flex:1;min-height:63px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden\">{{ s.desc }}<\u002Fdiv>\n                <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap\">\n                  <span style=\"display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:{{ s.statusColor }};background:{{ s.statusBg }};padding:6px 12px;border-radius:999px\"><span style=\"width:7px;height:7px;border-radius:50%;background:{{ s.statusColor }}\"><\u002Fspan>{{ s.statusLabel }}<\u002Fspan>\n                  <span title=\"{{ s.deptName }}\" style=\"font-size:12px;color:var(--text-muted);display:inline-flex;align-items:center;gap:5px;min-width:0\"><i data-lucide=\"building-2\" style=\"width:13px;height:13px;flex:none\"><\u002Fi><span style=\"white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px\">{{ s.deptName }}<\u002Fspan><\u002Fspan>\n                <\u002Fdiv>\n                <div class=\"mb-card-actions\" style=\"display:flex;gap:10px;margin-top:2px\">\n                  <a href=\"{{ s.link }}\" target=\"_blank\" rel=\"noopener\" class=\"mb-btn\" style=\"flex:1;text-align:center;border:1px solid var(--border-strong);background:transparent;color:var(--brown-800);font-weight:700;font-size:14px;padding:11px 14px;border-radius:12px\" style-hover=\"background:var(--tan-100)\">Подробнее об услуге<\u002Fa>\n                  <button onclick=\"{{ s.openModal }}\" class=\"mb-btn\" style=\"flex:1;cursor:pointer;border:none;background:var(--coral-600);color:#fff;font-weight:700;font-size:14px;padding:11px 14px;border-radius:12px;font-family:inherit\" style-hover=\"background:var(--coral-700)\">Записаться<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n\n      <sc-if value=\"{{ showEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"border:1px dashed var(--border-strong);border-radius:20px;padding:48px 32px;text-align:center;background:var(--surface-card)\">\n          <div style=\"width:58px;height:58px;border-radius:50%;background:var(--tan-100);color:var(--coral-600);display:flex;align-items:center;justify-content:center;margin:0 auto 16px\"><i data-lucide=\"search-x\" style=\"width:28px;height:28px\"><\u002Fi><\u002Fdiv>\n          <div style=\"font-size:19px;font-weight:700;color:var(--text-strong);margin-bottom:8px\">По выбранным фильтрам услуг не найдено<\u002Fdiv>\n          <p style=\"margin:0 0 22px;font-size:15px;color:var(--text-muted);max-width:420px;margin-left:auto;margin-right:auto\">Сбросьте фильтры или оставьте заявку — мы подберём поддержку индивидуально.<\u002Fp>\n          <button class=\"mb-btn\" onclick=\"{{ openModal }}\" style=\"border:none;cursor:pointer;background:var(--coral-600);color:#fff;font-weight:700;font-size:15px;padding:13px 28px;border-radius:13px\" style-hover=\"background:var(--coral-700)\">Оставить заявку<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- CTA -->\n  <section style=\"max-width:1240px;margin:0 auto;padding:0 32px 80px\">\n    <div style=\"background:var(--tan-100);border:1px solid var(--border-subtle);border-radius:26px;padding:48px;display:flex;align-items:center;justify-content:space-between;gap:32px;flex-wrap:wrap\">\n      <div style=\"max-width:620px\">\n        <h2 style=\"margin:0 0 10px;color:var(--text-strong);font-size:30px;font-weight:800;letter-spacing:-.01em\">Не нашли нужную услугу?<\u002Fh2>\n        <p style=\"margin:0;color:var(--text-muted);font-size:18px;line-height:1.55\">Оставьте заявку — специалист центра подберёт подходящие меры поддержки бесплатно.<\u002Fp>\n      <\u002Fdiv>\n      <button class=\"mb-btn\" onclick=\"{{ openModal }}\" style=\"border:none;cursor:pointer;background:var(--coral-600);color:#fff;font-weight:700;font-size:17px;padding:16px 32px;border-radius:14px;box-shadow:0 12px 28px -10px rgba(221,75,51,.7)\" style-hover=\"background:var(--coral-700)\">Получить консультацию<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FOOTER -->\n  <footer style=\"background:var(--brown-900);color:rgba(251,246,240,.72)\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:64px 32px 36px;display:grid;grid-template-columns:1.5fr 1fr 1.2fr;gap:44px\">\n      <div>\n        <img src=\"7df9e2c5-e0a2-4e29-a447-a9b4e59e5ad8\" alt=\"Мой бизнес\" style=\"height:46px;margin-bottom:18px;filter:brightness(0) invert(1)\">\n        <p style=\"margin:0 0 20px;font-size:14px;line-height:1.6;max-width:340px\">Центр поддержки предпринимательства Калининградской области. Все услуги центра бесплатны.<\u002Fp>\n        <div style=\"display:flex;gap:12px\">\n          <sc-for list=\"{{ socials }}\" as=\"so\" hint-placeholder-count=\"4\">\n            <a class=\"mb-link\" href=\"#\" style=\"width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center\"><i data-lucide=\"{{ so }}\" style=\"width:18px;height:18px\"><\u002Fi><\u002Fa>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"color:var(--tan-400);font-weight:700;font-size:14px;margin-bottom:14px\">Разделы<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:9px;font-size:14px\">\n          <a class=\"mb-link\" href=\"Лендинг Мой бизнес.dc.html#about\">О Центре<\u002Fa>\n          <a class=\"mb-link\" href=\"Услуги.dc.html\">Услуги<\u002Fa>\n          <a class=\"mb-link\" href=\"Лендинг Мой бизнес.dc.html#events\">Мероприятия<\u002Fa>\n          <a class=\"mb-link\" href=\"Лендинг Мой бизнес.dc.html#news\">Новости<\u002Fa>\n          <a class=\"mb-link\" href=\"Лендинг Мой бизнес.dc.html#stories\">Истории успеха<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"color:var(--tan-400);font-weight:700;font-size:14px;margin-bottom:14px\">Реквизиты и контакты<\u002Fdiv>\n        <div style=\"font-size:14px;line-height:1.7\">\n          236022, г. Калининград, ул. Уральская, 18, каб. 408–422<br>\n          <a class=\"mb-link\" href=\"tel:+74012994588\">+7 (4012) 994&nbsp;588<\u002Fa> · <a class=\"mb-link\" href=\"tel:+74012994904\">994-904<\u002Fa><br>\n          <a class=\"mb-link\" href=\"mailto:info@mbkaliningrad.ru\">info@mbkaliningrad.ru<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-top:1px solid rgba(255,255,255,.12);padding:18px 0;text-align:center;font-size:13px;color:rgba(251,246,240,.5)\">© 2013–2026 Фонд поддержки предпринимательства · Национальный проект «МСП»<\u002Fdiv>\n  <\u002Ffooter>\n\n  <!-- Sticky consult button -->\n  <button class=\"mb-btn\" onclick=\"{{ openModal }}\" style=\"position:fixed;right:26px;bottom:26px;z-index:45;border:none;cursor:pointer;background:var(--coral-600);color:#fff;font-weight:700;font-size:15px;padding:15px 24px;border-radius:999px;display:flex;align-items:center;gap:9px;animation:mbpulse 2.4s ease-in-out infinite\" style-hover=\"background:var(--coral-700)\"><i data-lucide=\"message-circle\" style=\"width:20px;height:20px\"><\u002Fi>Записаться на консультацию<\u002Fbutton>\n\n  <!-- MODAL -->\n  <sc-if value=\"{{ modalOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div onclick=\"{{ closeModal }}\" style=\"position:fixed;inset:0;background:rgba(42,32,29,.55);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px\">\n      <div onclick=\"{{ stop }}\" style=\"background:var(--surface-card);border-radius:20px;padding:32px;width:480px;max-width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 30px 80px -30px rgba(0,0,0,.5)\">\n        <sc-if value=\"{{ modalSent }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"text-align:center;padding:14px 0\">\n            <div style=\"width:64px;height:64px;border-radius:50%;background:rgba(46,139,87,.15);color:var(--success);display:flex;align-items:center;justify-content:center;margin:0 auto 18px\"><i data-lucide=\"check\" style=\"width:32px;height:32px\"><\u002Fi><\u002Fdiv>\n            <h3 style=\"margin:0 0 10px;color:var(--text-strong);font-size:22px\">Спасибо за обращение<\u002Fh3>\n            <p style=\"margin:0 0 22px;color:var(--text-muted);font-size:16px;line-height:1.5\">Наши специалисты свяжутся с вами в течение одного рабочего дня.<\u002Fp>\n            <button class=\"mb-btn\" onclick=\"{{ closeModal }}\" style=\"border:none;cursor:pointer;background:var(--brown-800);color:#fff;font-weight:700;font-size:15px;padding:12px 28px;border-radius:13px\">Закрыть<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ modalForm }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;flex-direction:column;gap:14px\">\n            <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:12px\">\n              <div>\n                <h3 style=\"margin:0 0 4px;color:var(--text-strong);font-size:23px\">Заявка на консультацию<\u002Fh3>\n                <p style=\"margin:0;color:var(--text-muted);font-size:14px\">Оставьте свой вопрос, и мы обязательно свяжемся с вами.<\u002Fp>\n              <\u002Fdiv>\n              <button onclick=\"{{ closeModal }}\" style=\"flex:none;cursor:pointer;border:none;background:var(--tan-100);width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--brown-800)\"><i data-lucide=\"x\" style=\"width:18px;height:18px\"><\u002Fi><\u002Fbutton>\n            <\u002Fdiv>\n            <sc-if value=\"{{ selectedServiceTitle }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"background:var(--tan-100);color:var(--text-muted);font-size:13px;padding:10px 13px;border-radius:11px;line-height:1.4\">Заявка по услуге: <strong style=\"color:var(--text-strong)\">{{ selectedServiceTitle }}<\u002Fstrong><\u002Fdiv>\n            <\u002Fsc-if>\n            <input placeholder=\"Фамилия, имя, отчество\" style=\"width:100%;padding:13px 15px;border:1px solid var(--border-strong);border-radius:13px;font-size:15px;font-family:inherit;background:var(--bg)\">\n            <input placeholder=\"Телефон\" style=\"width:100%;padding:13px 15px;border:1px solid var(--border-strong);border-radius:13px;font-size:15px;font-family:inherit;background:var(--bg)\">\n            <input placeholder=\"Электронная почта\" style=\"width:100%;padding:13px 15px;border:1px solid var(--border-strong);border-radius:13px;font-size:15px;font-family:inherit;background:var(--bg)\">\n            <textarea placeholder=\"Кратко опишите вопрос (необязательно)\" rows=\"3\" style=\"width:100%;padding:13px 15px;border:1px solid var(--border-strong);border-radius:13px;font-size:15px;font-family:inherit;background:var(--bg);resize:vertical\"><\u002Ftextarea>\n            <button class=\"mb-btn\" onclick=\"{{ submitModal }}\" style=\"border:none;cursor:pointer;background:var(--coral-600);color:#fff;font-weight:700;font-size:16px;padding:14px;border-radius:13px;width:100%\" style-hover=\"background:var(--coral-700)\">Отправить заявку<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { audience: \"all\", cats: [], modalOpen: false, sent: false, menuOpen: false, services: [], selectedService: null };\n\n  componentDidMount() {\n    const poll = () => {\n      if (window.MB_SERVICES) this.setState({ services: window.MB_SERVICES });\n      else this._p = setTimeout(poll, 60);\n    };\n    poll();\n    try {\n      const p = new URLSearchParams(location.search);\n      const a = p.get(\"audience\");\n      if (a && [\"start\", \"self\", \"business\", \"export\", \"producers\", \"veterans\"].includes(a)) {\n        this.setState({ audience: a });\n      }\n    } catch (e) {}\n    this._draw();\n  }\n\n  componentDidUpdate() { this._draw(); }\n  componentWillUnmount() { clearTimeout(this._t); clearTimeout(this._p); }\n\n  _draw() {\n    clearTimeout(this._t);\n    this._t = setTimeout(() => { if (window.lucide) window.lucide.createIcons(); }, 60);\n  }\n\n  renderVals() {\n    const CATS = [\n      { key: \"promo\", title: \"Продвижение\", icon: \"megaphone\" },\n      { key: \"tech\", title: \"Технологии и сервисы\", icon: \"cpu\" },\n      { key: \"consult\", title: \"Консультации\", icon: \"messages-square\" },\n      { key: \"finance\", title: \"Финансы\", icon: \"banknote\" },\n      { key: \"education\", title: \"Обучение\", icon: \"graduation-cap\" },\n      { key: \"foreign\", title: \"Выход на зарубежные рынки\", icon: \"globe\" },\n      { key: \"property\", title: \"Имущество\", icon: \"building-2\" },\n      { key: \"infra\", title: \"Инфраструктура\", icon: \"network\" },\n    ];\n\n    const AUD = [\n      { key: \"all\", label: \"Все\" },\n      { key: \"start\", label: \"Желающим открыть бизнес\" },\n      { key: \"business\", label: \"Действующим ИП, юрлицам, работодателям\" },\n      { key: \"producers\", label: \"Производителям, фермерам, инноваторам\" },\n      { key: \"self\", label: \"Самозанятым\" },\n      { key: \"export\", label: \"Экспортёрам\" },\n      { key: \"veterans\", label: \"Ветеранам СВО и их семьям\" },\n    ];\n\n    const DEPT = {\n      \"ЦПП\": \"Центр поддержки предпринимательства\",\n      \"КЦ\": \"Консультационный центр\",\n      \"ФРП\": \"Фонд развития промышленности\",\n      \"ЦКСХ\": \"Центр компетенций в сфере сельхозкооперации\",\n      \"РЦК\": \"Региональный центр компетенций\",\n      \"ИИЦ\": \"Инновационно-инжиниринговый центр\",\n      \"ФМФ\": \"Фонд микрофинансирования\",\n      \"ГФ\": \"Гарантийный фонд\",\n      \"ЦИСС\": \"Центр инноваций социальной сферы\",\n      \"ЦКР\": \"Центр кластерного развития\",\n      \"ЦПЭ\": \"Центр поддержки экспорта\",\n      \"ЦКИ\": \"Центр креативных индустрий\",\n    };\n\n    const S = this.state.services.map(s => ({ ...s, deptName: DEPT[s.dept] || s.dept }));\n\n    const STATUS = {\n      open: { label: \"Идёт приём заявок\", color: \"var(--success)\", bg: \"rgba(46,139,87,.12)\" },\n      closed: { label: \"Архив / завершено\", color: \"var(--text-muted)\", bg: \"var(--tan-100)\" },\n      holded: { label: \"Приём временно приостановлен\", color: \"#b5651d\", bg: \"rgba(207,158,112,.22)\" },\n    };\n\n    const aud = this.state.audience;\n    const cats = this.state.cats;\n    const openModal = (s) => this.setState({ modalOpen: true, sent: false, selectedService: s || null });\n\n    const ORDER = { open: 0, holded: 1, closed: 2 };\n    const audKey = aud === \"veterans\" ? \"start\" : aud;\n    const visible = S.filter(s =>\n      (aud === \"all\" || s.aud.includes(audKey)) &&\n      (cats.length === 0 || s.cats.some(c => cats.includes(c)))\n    );\n\n    const groups = CATS\n      .map(c => ({\n        ...c,\n        items: visible.filter(s => s.cats.includes(c.key))\n          .sort((a, b) => (ORDER[a.status] ?? 9) - (ORDER[b.status] ?? 9))\n          .map(s => {\n            const st = STATUS[s.status];\n            return { ...s, statusLabel: st.label, statusColor: st.color, statusBg: st.bg, openModal: () => openModal(s) };\n          }),\n      }))\n      .filter(c => c.items.length > 0 && (cats.length === 0 || cats.includes(c.key)))\n      .map(c => ({ ...c, countLabel: c.items.length + (c.items.length === 1 ? \" услуга\" : (c.items.length < 5 ? \" услуги\" : \" услуг\")) }));\n\n    const audLabel = AUD.find(a => a.key === aud);\n\n    return {\n      menuOpen: this.state.menuOpen,\n      navLinks: [\n        { label: \"О Центре\", href: \"Лендинг Мой бизнес.dc.html#about\" },\n        { label: \"Услуги\", href: \"Услуги.dc.html\" },\n        { label: \"Мероприятия\", href: \"Лендинг Мой бизнес.dc.html#events\" },\n        { label: \"Новости\", href: \"Лендинг Мой бизнес.dc.html#news\" },\n        { label: \"Истории успеха\", href: \"Лендинг Мой бизнес.dc.html#stories\" },\n        { label: \"Контакты\", href: \"Лендинг Мой бизнес.dc.html#contacts\" },\n      ],\n      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),\n      closeMenu: () => this.setState({ menuOpen: false }),\n      openModalFromMenu: () => this.setState({ menuOpen: false, modalOpen: true, sent: false }),\n      audienceRadios: AUD.map(a => ({\n        label: a.label,\n        onClick: () => this.setState({ audience: a.key }),\n        ring: aud === a.key ? \"var(--coral-600)\" : \"var(--border-strong)\",\n        dot: aud === a.key ? \"var(--coral-600)\" : \"transparent\",\n        color: aud === a.key ? \"var(--text-strong)\" : \"var(--text-body)\",\n        weight: aud === a.key ? \"700\" : \"500\",\n      })),\n      categoryChecks: CATS.map(c => {\n        const on = cats.includes(c.key);\n        return {\n          label: c.title,\n          onClick: () => this.setState(s => ({ cats: s.cats.includes(c.key) ? s.cats.filter(x => x !== c.key) : [...s.cats, c.key] })),\n          ring: on ? \"var(--coral-600)\" : \"var(--border-strong)\",\n          fill: on ? \"var(--coral-600)\" : \"transparent\",\n          checkOpacity: on ? \"1\" : \"0\",\n          color: on ? \"var(--text-strong)\" : \"var(--text-body)\",\n          weight: on ? \"700\" : \"500\",\n        };\n      }),\n      resetFilters: () => this.setState({ audience: \"all\", cats: [] }),\n      groups,\n      totalCount: visible.length,\n      showEmpty: visible.length === 0,\n      audienceLabel: aud === \"all\" ? \"Все аудитории\" : (audLabel ? audLabel.label : \"\"),\n      vetBanner: aud === \"veterans\",\n\n      modalOpen: this.state.modalOpen,\n      modalForm: this.state.modalOpen && !this.state.sent,\n      modalSent: this.state.modalOpen && this.state.sent,\n      openModal,\n      closeModal: () => this.setState({ modalOpen: false, sent: false, selectedService: null }),\n      submitModal: () => this.setState({ sent: true }),\n      selectedServiceTitle: this.state.selectedService ? this.state.selectedService.title : \"\",\n      stop: (e) => e.stopPropagation(),\n\n      socials: [\"send\", \"play-circle\", \"rss\", \"users\"],\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
